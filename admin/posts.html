<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posts — Admin — RapidFix Kenya</title>
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .post-form { display: none; }
    .post-form.open { display: block; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .form-full { grid-column: 1 / -1; }
    textarea { min-height: 220px; resize: vertical; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside id="adminSidebar" class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-sidebar-brand">
          <div class="admin-sidebar-icon">
            <i class="fas fa-cog"></i>
          </div>
          <div>
            <div class="admin-sidebar-title">Admin</div>
            <div class="admin-sidebar-subtitle">RapidFix Kenya</div>
          </div>
        </div>
        <button id="adminSidebarClose" class="admin-sidebar-close" aria-label="Close menu">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <nav class="admin-sidebar-nav">
        <a href="/admin/index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/admin/messages.html"><i class="fas fa-envelope"></i> Messages</a>
        <a href="/admin/reviews.html"><i class="fas fa-star"></i> Reviews</a>
        <a href="/admin/settings.html"><i class="fas fa-cog"></i> Site Settings</a>
        <a href="/admin/posts.html" class="active"><i class="fas fa-newspaper"></i> Posts</a>
        <a href="/admin/analytics.html" class="opacity-50 pointer-events-none"><i class="fas fa-chart-line"></i> Analytics</a>
      </nav>
    </aside>

    <div id="adminSidebarOverlay" class="admin-sidebar-overlay"></div>

    <div class="admin-main">
      <header class="admin-header">
        <div class="admin-header-left">
          <button id="adminMobileToggle" class="admin-mobile-toggle" aria-label="Open menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="admin-header-title">Posts</div>
        </div>
        <div class="admin-header-right">
          <span id="adminEmail" class="admin-header-email">Loading...</span>
          <button id="adminLogoutBtn" class="admin-logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </header>

      <main class="admin-content">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-xl font-bold text-gray-800">Posts</h1>
          <div class="flex gap-2">
            <button onclick="openPostForm()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold px-4 py-2 rounded-lg transition">
              <i class="fas fa-plus"></i> New Post
            </button>
            <button onclick="loadPosts()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2 rounded-lg transition">
              <i class="fas fa-sync-alt"></i> Refresh
            </button>
          </div>
        </div>

        <div id="postError" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
        <div id="postSuccess" class="hidden mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm"></div>

        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden mb-6">
          <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200">
            <button onclick="setPostFilter('all')" class="px-3 py-1 rounded-lg text-sm font-medium bg-gray-100 text-gray-700" data-filter="all">All</button>
            <button onclick="setPostFilter('draft')" class="px-3 py-1 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50" data-filter="draft">Draft</button>
            <button onclick="setPostFilter('published')" class="px-3 py-1 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50" data-filter="published">Published</button>
            <button onclick="setPostFilter('archived')" class="px-3 py-1 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50" data-filter="archived">Archived</button>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Title</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Slug</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Category</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Status</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Published</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Updated</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Read Time</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Actions</th>
                </tr>
              </thead>
              <tbody id="postTableBody" class="divide-y divide-gray-100">
                <tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div id="postForm" class="post-form bg-white rounded-xl border border-gray-200 p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 id="postFormTitle" class="text-lg font-semibold text-gray-800">New Post</h2>
            <button onclick="closePostForm()" class="text-gray-500 hover:text-gray-700">Close</button>
          </div>
          <div class="form-grid">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
              <input type="text" id="postTitle" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" placeholder="Post title" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Slug <span class="text-red-500">*</span></label>
              <input type="text" id="postSlug" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" placeholder="url-friendly-slug" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
              <input type="text" id="postCategory" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" placeholder="e.g. ELECTRONICS" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
              <select id="postStatus" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
                <option value="archived">Archived</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Published At</label>
              <input type="datetime-local" id="postPublishedAt" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Author ID</label>
              <input type="text" id="postAuthorId" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" placeholder="UUID (optional)" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
              <input type="text" id="postImageUrl" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" placeholder="https://..." />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Read Time</label>
              <input type="text" id="postReadTime" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" placeholder="e.g. 5 min read" />
            </div>
            <div class="form-full">
              <label class="block text-sm font-medium text-gray-700 mb-1">Excerpt</label>
              <textarea id="postExcerpt" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" rows="3" placeholder="Short summary..."></textarea>
            </div>
            <div class="form-full">
              <label class="block text-sm font-medium text-gray-700 mb-1">Content <span class="text-red-500">*</span></label>
              <textarea id="postContent" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" rows="10" placeholder="Post content..."></textarea>
            </div>
            <div class="form-full">
              <label class="block text-sm font-medium text-gray-700 mb-1">Meta Description</label>
              <textarea id="postMetaDescription" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" rows="2" placeholder="SEO description..."></textarea>
            </div>
            <div class="form-full">
              <label class="block text-sm font-medium text-gray-700 mb-1">Meta Keywords</label>
              <input type="text" id="postMetaKeywords" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200" placeholder="comma, separated, keywords" />
            </div>
          </div>
          <div class="mt-4 flex justify-end gap-2">
            <button onclick="closePostForm()" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</button>
            <button onclick="savePost()" class="px-4 py-2 rounded-lg bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold">Save Post</button>
          </div>
          <input type="hidden" id="postId" value="" />
        </div>
      </main>
    </div>
  </div>

  <div id="deleteConfirm" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-6 max-w-sm w-full mx-4">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Delete Post</h3>
      <p class="text-gray-600 text-sm mb-4">This action cannot be undone. Are you sure you want to delete this post?</p>
      <div class="flex justify-end gap-2">
        <button onclick="closeDeleteConfirm()" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</button>
        <button onclick="confirmDelete()" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white font-semibold">Delete</button>
      </div>
    </div>
  </div>

  <script>
    window.__RAPIDFIX_SUPABASE__ = {
      url: 'https://qspxyikonaelzdvithxk.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcHh5aWtvbmFlbHpkdml0aHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwOTE1OTQsImV4cCI6MjEwMjY2NzU5NH0.dXzbBQTjRLh_bi7IHKmCnpR_Az2UdhqnQfdzRuKjV4E'
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/admin-auth.js"></script>
  <script src="/js/admin-shell.js"></script>

  <script>
    var currentFilter = 'all';
    var deleteTargetId = null;

    (async function () {
      await window.RapidFixAdmin.requireAdmin({ redirectTo: '/admin/login.html' });
      loadPosts();
    })();

    function setPostFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('[data-filter]').forEach(function (btn) {
        if (btn.dataset.filter === filter) {
          btn.classList.add('bg-gray-100', 'text-gray-700');
          btn.classList.remove('text-gray-600', 'hover:bg-gray-50');
        } else {
          btn.classList.remove('bg-gray-100', 'text-gray-700');
          btn.classList.add('text-gray-600', 'hover:bg-gray-50');
        }
      });
      loadPosts();
    }

    function showPostError(message) {
      var el = document.getElementById('postError');
      el.textContent = message;
      el.classList.remove('hidden');
      document.getElementById('postSuccess').classList.add('hidden');
    }

    function showPostSuccess(message) {
      var el = document.getElementById('postSuccess');
      el.textContent = message;
      el.classList.remove('hidden');
      document.getElementById('postError').classList.add('hidden');
    }

    async function loadPosts() {
      var tbody = document.getElementById('postTableBody');
      tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>';
      showPostError('');
      showPostSuccess('');

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showPostError('Session expired. Please log in again.');
          return;
        }

        var url = '/api/posts?status=' + encodeURIComponent(currentFilter);
        var response = await fetch(url, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok) {
          var err = await response.json();
          showPostError(err.error || 'Failed to load posts.');
          return;
        }

        var posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">No posts found.</td></tr>';
          return;
        }

        var html = '';
        posts.forEach(function (post) {
          var statusClass = post.status === 'published' ? 'bg-green-100 text-green-700' : post.status === 'draft' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700';
          html += '<tr>' +
            '<td class="px-4 py-3">' + escapeHtml(post.title || '') + '</td>' +
            '<td class="px-4 py-3 font-mono text-xs">' + escapeHtml(post.slug || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(post.category || '') + '</td>' +
            '<td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ' + statusClass + '">' + (post.status || '') + '</span></td>' +
            '<td class="px-4 py-3">' + formatDate(post.published_at) + '</td>' +
            '<td class="px-4 py-3">' + formatDate(post.updated_at) + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(post.read_time || '') + '</td>' +
            '<td class="px-4 py-3">' +
              '<button onclick="editPost(\'' + post.id + '\')" class="text-blue-600 hover:text-blue-800 mr-2">Edit</button>' +
              '<button onclick="askDeletePost(\'' + post.id + '\')" class="text-red-600 hover:text-red-800">Delete</button>' +
            '</td>' +
          '</tr>';
        });

        tbody.innerHTML = html;
      } catch (e) {
        showPostError('Error loading posts: ' + e.message);
      }
    }

    function openPostForm() {
      document.getElementById('postForm').classList.add('open');
      document.getElementById('postFormTitle').textContent = 'New Post';
      document.getElementById('postId').value = '';
      document.getElementById('postTitle').value = '';
      document.getElementById('postSlug').value = '';
      document.getElementById('postCategory').value = '';
      document.getElementById('postStatus').value = 'draft';
      document.getElementById('postPublishedAt').value = '';
      document.getElementById('postAuthorId').value = '';
      document.getElementById('postImageUrl').value = '';
      document.getElementById('postReadTime').value = '';
      document.getElementById('postExcerpt').value = '';
      document.getElementById('postContent').value = '';
      document.getElementById('postMetaDescription').value = '';
      document.getElementById('postMetaKeywords').value = '';
      showPostError('');
      showPostSuccess('');
    }

    function closePostForm() {
      document.getElementById('postForm').classList.remove('open');
    }

    document.getElementById('postTitle').addEventListener('input', function () {
      var slug = this.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      document.getElementById('postSlug').value = slug;
    });

    async function savePost() {
      var id = document.getElementById('postId').value.trim();
      var title = document.getElementById('postTitle').value.trim();
      var slug = document.getElementById('postSlug').value.trim();
      var content = document.getElementById('postContent').value.trim();
      var excerpt = document.getElementById('postExcerpt').value.trim();
      var category = document.getElementById('postCategory').value.trim();
      var status = document.getElementById('postStatus').value;
      var publishedAt = document.getElementById('postPublishedAt').value;
      var authorId = document.getElementById('postAuthorId').value.trim();
      var imageUrl = document.getElementById('postImageUrl').value.trim();
      var readTime = document.getElementById('postReadTime').value.trim();
      var metaDescription = document.getElementById('postMetaDescription').value.trim();
      var metaKeywords = document.getElementById('postMetaKeywords').value.trim();

      if (!title || !slug || !content) {
        showPostError('Title, slug, and content are required.');
        return;
      }

      showPostError('');
      showPostSuccess('');

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showPostError('Session expired. Please log in again.');
          return;
        }

        var payload = {
          title: title,
          slug: slug,
          content: content,
          excerpt: excerpt || null,
          category: category || null,
          status: status,
          published_at: publishedAt ? new Date(publishedAt).toISOString() : new Date().toISOString(),
          author_id: authorId || null,
          image_url: imageUrl || null,
          read_time: readTime || null,
          meta_description: metaDescription || null,
          meta_keywords: metaKeywords || null
        };

        var method = id ? 'PATCH' : 'POST';
        var url = '/api/posts';
        var response = await fetch(url, {
          method: method,
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(id ? Object.assign({ id: id }, payload) : payload)
        });

        if (!response.ok) {
          var err = await response.json();
          showPostError(err.error || 'Failed to save post.');
          return;
        }

        showPostSuccess(id ? 'Post updated successfully.' : 'Post created successfully.');
        closePostForm();
        loadPosts();
      } catch (e) {
        showPostError('Error saving post: ' + e.message);
      }
    }

    async function editPost(id) {
      showPostError('');
      showPostSuccess('');

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showPostError('Session expired. Please log in again.');
          return;
        }

        var response = await fetch('/api/posts?status=all', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok) {
          var err = await response.json();
          showPostError(err.error || 'Failed to load post.');
          return;
        }

        var posts = await response.json();
        var post = posts.find(function (p) { return p.id === id; });
        if (!post) {
          showPostError('Post not found.');
          return;
        }

        document.getElementById('postFormTitle').textContent = 'Edit Post';
        document.getElementById('postId').value = post.id || '';
        document.getElementById('postTitle').value = post.title || '';
        document.getElementById('postSlug').value = post.slug || '';
        document.getElementById('postCategory').value = post.category || '';
        document.getElementById('postStatus').value = post.status || 'draft';
        document.getElementById('postPublishedAt').value = post.published_at ? post.published_at.slice(0, 16) : '';
        document.getElementById('postAuthorId').value = post.author_id || '';
        document.getElementById('postImageUrl').value = post.image_url || '';
        document.getElementById('postReadTime').value = post.read_time || '';
        document.getElementById('postExcerpt').value = post.excerpt || '';
        document.getElementById('postContent').value = post.content || '';
        document.getElementById('postMetaDescription').value = post.meta_description || '';
        document.getElementById('postMetaKeywords').value = post.meta_keywords || '';
        document.getElementById('postForm').classList.add('open');
      } catch (e) {
        showPostError('Error loading post: ' + e.message);
      }
    }

    function askDeletePost(id) {
      deleteTargetId = id;
      document.getElementById('deleteConfirm').classList.remove('hidden');
    }

    function closeDeleteConfirm() {
      deleteTargetId = null;
      document.getElementById('deleteConfirm').classList.add('hidden');
    }

    async function confirmDelete() {
      if (!deleteTargetId) return;

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showPostError('Session expired. Please log in again.');
          closeDeleteConfirm();
          return;
        }

        var response = await fetch('/api/posts?id=' + encodeURIComponent(deleteTargetId), {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok && response.status !== 204) {
          var err = await response.json();
          showPostError(err.error || 'Failed to delete post.');
          closeDeleteConfirm();
          return;
        }

        showPostSuccess('Post deleted successfully.');
        closeDeleteConfirm();
        loadPosts();
      } catch (e) {
        showPostError('Error deleting post: ' + e.message);
        closeDeleteConfirm();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
