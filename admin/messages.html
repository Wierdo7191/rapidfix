<!DOCTYPE html>

<head>

</head>
<body>
  <div class="admin-layout">
    <aside id="adminSidebar" class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-sidebar-brand">
          <div class="admin-sidebar-icon">
            <i class="fas fa-cog"></i>
          </div>
          <div>
            <div class="admin-sidebar-title">Admin</div>
            <div class="admin-sidebar-subtitle">RapidFix Kenya</div>
          </div>
        </div>
        <button id="adminSidebarClose" class="admin-sidebar-close" aria-label="Close menu">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <nav class="admin-sidebar-nav">
        <a href="/admin/index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/admin/messages.html"><i class="fas fa-envelope"></i> Messages</a>
        <a href="/admin/reviews.html"><i class="fas fa-star"></i> Reviews</a>
        <a href="/admin/settings.html"><i class="fas fa-cog"></i> Site Settings</a>
        <a href="/admin/content.html" class="opacity-50 pointer-events-none"><i class="fas fa-file-alt"></i> Frontend Content</a>
        <a href="/admin/posts.html" class="opacity-50 pointer-events-none"><i class="fas fa-newspaper"></i> Posts</a>
        <a href="/admin/analytics.html" class="opacity-50 pointer-events-none"><i class="fas fa-chart-line"></i> Analytics</a>
      </nav>
    </aside>

    <div id="adminSidebarOverlay" class="admin-sidebar-overlay"></div>

    <div class="admin-main">
      <header class="admin-header">
        <div class="admin-header-left">
          <button id="adminMobileToggle" class="admin-mobile-toggle" aria-label="Open menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="admin-header-title">Messages</div>
        </div>
        <div class="admin-header-right">
          <span id="adminEmail" class="admin-header-email">Loading...</span>
          <button id="adminLogoutBtn" class="admin-logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </header>

      <main class="admin-content">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-xl font-bold text-gray-800">Messages</h1>
          <button onclick="loadMessages()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2 rounded-lg transition">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>

        <div id="messageError" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
        <div id="messageSuccess" class="hidden mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm"></div>

        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Name</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Email</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Phone</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Appliance</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Description</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Status</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Date</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Actions</th>
                </tr>
              </thead>
              <tbody id="messageTableBody" class="divide-y divide-gray-100">
                <tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    window.__RAPIDFIX_SUPABASE__ = {
      url: 'https://qspxyikonaelzdvithxk.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcHh5aWtvbmFlbHpkdml0aHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwOTE1OTQsImV4cCI6MjEwMjY2NzU5NH0.dXzbBQTjRLh_bi7IHKmCnpR_Az2UdhqnQfdzRuKjV4E'
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/admin-auth.js"></script>
  <script src="/js/admin-shell.js"></script>

  <script>
    (async function () {
      await window.RapidFixAdmin.requireAdmin({ redirectTo: '/admin/login.html' });
      loadMessages();
    })();

    function showMessageError(message) {
      var el = document.getElementById('messageError');
      el.textContent = message;
      el.classList.remove('hidden');
      document.getElementById('messageSuccess').classList.add('hidden');
    }

    function showMessageSuccess(message) {
      var el = document.getElementById('messageSuccess');
      el.textContent = message;
      el.classList.remove('hidden');
      document.getElementById('messageError').classList.add('hidden');
    }

    async function loadMessages() {
      var tbody = document.getElementById('messageTableBody');
      tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>';
      showMessageError('');
      showMessageSuccess('');

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showMessageError('Session expired. Please log in again.');
          return;
        }

        var response = await fetch('/api/messages', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok) {
          var err = await response.json();
          showMessageError(err.error || 'Failed to load messages.');
          return;
        }

        var messages = await response.json();
        if (!Array.isArray(messages) || messages.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-gray-500">No messages found.</td></tr>';
          return;
        }

        var html = '';
        messages.forEach(function (msg) {
          var statusClass = msg.status === 'new' ? 'bg-blue-100 text-blue-700' : msg.status === 'read' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700';
          var nextStatus = msg.status === 'new' ? 'read' : msg.status === 'read' ? 'archived' : null;

          html += '<tr>' +
            '<td class="px-4 py-3">' + escapeHtml(msg.name || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(msg.email || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(msg.phone || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(msg.appliance || '') + '</td>' +
            '<td class="px-4 py-3 max-w-xs truncate" title="' + escapeHtml(msg.description || '') + '">' + escapeHtml(msg.description || '') + '</td>' +
            '<td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ' + statusClass + '">' + (msg.status || '') + '</span></td>' +
            '<td class="px-4 py-3">' + formatDate(msg.created_at) + '</td>' +
            '<td class="px-4 py-3">' + (nextStatus ? '<button onclick="updateMessageStatus(\'' + msg.id + '\', \'' + nextStatus + '\')" class="text-blue-600 hover:text-blue-800">Mark ' + nextStatus + '</button>' : '<span class="text-gray-400 text-xs">No actions</span>') + '</td>' +
          '</tr>';
        });

        tbody.innerHTML = html;
      } catch (e) {
        showMessageError('Error loading messages: ' + e.message);
      }
    }

    async function updateMessageStatus(id, status) {
      showMessageError('');
      showMessageSuccess('');

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showMessageError('Session expired. Please log in again.');
          return;
        }

        var response = await fetch('/api/messages', {
          method: 'PATCH',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id: id, status: status })
        });

        if (!response.ok) {
          var err = await response.json();
          showMessageError(err.error || 'Failed to update message.');
          return;
        }

        showMessageSuccess('Message marked as ' + status + '.');
        loadMessages();
      } catch (e) {
        showMessageError('Error updating message: ' + e.message);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
