    <aside id="adminSidebar" class="admin-sidebar">

      </div>
      <nav class="admin-sidebar-nav">

        <a href="/admin/messages.html"><i class="fas fa-envelope"></i> Messages</a>
        <a href="/admin/reviews.html"><i class="fas fa-star"></i> Reviews</a>
        <a href="/admin/settings.html"><i class="fas fa-cog"></i> Site Settings</a>
        <a href="/admin/content.html" class="opacity-50 pointer-events-none"><i class="fas fa-file-alt"></i> Frontend Content</a>
        <a href="/admin/posts.html" class="opacity-50 pointer-events-none"><i class="fas fa-newspaper"></i> Posts</a>
        <a href="/admin/analytics.html" class="opacity-50 pointer-events-none"><i class="fas fa-chart-line"></i> Analytics</a>
      </nav>

    <div id="adminSidebarOverlay" class="admin-sidebar-overlay"></div>

    <div class="admin-main">
      <header class="admin-header">
        <div class="admin-header-left">
          <button id="adminMobileToggle" class="admin-mobile-toggle" aria-label="Open menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="admin-header-title">Bookings</div>
        </div>
        <div class="admin-header-right">
          <span id="adminEmail" class="admin-header-email">Loading...</span>
          <button id="adminLogoutBtn" class="admin-logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </header>

      <main class="admin-content">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-xl font-bold text-gray-800">Bookings</h1>
          <button onclick="loadBookings()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2 rounded-lg transition">
            <i class="fas fa-sync-alt"></i> Refresh
          </button>
        </div>

        <div id="bookingError" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
        <div id="bookingSuccess" class="hidden mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm"></div>

        <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Name</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Phone</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Appliance</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">County</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Town</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Location</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Status</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Date</th>
                  <th class="text-left px-4 py-3 font-medium text-gray-600">Actions</th>
                </tr>
              </thead>
              <tbody id="bookingTableBody" class="divide-y divide-gray-100">
                <tr><td colspan="9" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    window.__RAPIDFIX_SUPABASE__ = {
      url: 'https://qspxyikonaelzdvithxk.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcHh5aWtvbmFlbHpkdml0aHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwOTE1OTQsImV4cCI6MjEwMjY2NzU5NH0.dXzbBQTjRLh_bi7IHKmCnpR_Az2UdhqnQfdzRuKjV4E'
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/admin-auth.js"></script>
  <script src="/js/admin-shell.js"></script>

  <script>
    (async function () {
      await window.RapidFixAdmin.requireAdmin({ redirectTo: '/admin/login.html' });
      loadBookings();
    })();

    function showBookingError(message) {
      var el = document.getElementById('bookingError');
      el.textContent = message;
      el.classList.remove('hidden');
      document.getElementById('bookingSuccess').classList.add('hidden');
    }

    function showBookingSuccess(message) {
      var el = document.getElementById('bookingSuccess');
      el.textContent = message;
      el.classList.remove('hidden');
      document.getElementById('bookingError').classList.add('hidden');
    }

    async function loadBookings() {
      var tbody = document.getElementById('bookingTableBody');
      tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-8 text-center text-gray-500">Loading...</td></tr>';
      showBookingError('');
      showBookingSuccess('');

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showBookingError('Session expired. Please log in again.');
          return;
        }

        var response = await fetch('/api/bookings', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!response.ok) {
          var err = await response.json();
          showBookingError(err.error || 'Failed to load bookings.');
          return;
        }

        var bookings = await response.json();
        if (!Array.isArray(bookings) || bookings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-8 text-center text-gray-500">No bookings found.</td></tr>';
          return;
        }

        var html = '';
        bookings.forEach(function (booking) {
          var statusClass = booking.status === 'new' ? 'bg-blue-100 text-blue-700' : booking.status === 'confirmed' ? 'bg-green-100 text-green-700' : booking.status === 'completed' ? 'bg-purple-100 text-purple-700' : 'bg-red-100 text-red-700';
          var actions = getBookingActions(booking.status, booking.id);

          html += '<tr>' +
            '<td class="px-4 py-3">' + escapeHtml(booking.name || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(booking.phone || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(booking.appliance || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(booking.county || '') + '</td>' +
            '<td class="px-4 py-3">' + escapeHtml(booking.town || '') + '</td>' +
            '<td class="px-4 py-3 max-w-xs truncate" title="' + escapeHtml(booking.precise_location || '') + '">' + escapeHtml(booking.precise_location || '') + '</td>' +
            '<td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ' + statusClass + '">' + (booking.status || '') + '</span></td>' +
            '<td class="px-4 py-3">' + formatDate(booking.created_at) + '</td>' +
            '<td class="px-4 py-3">' + actions + '</td>' +
          '</tr>';
        });

        tbody.innerHTML = html;
      } catch (e) {
        showBookingError('Error loading bookings: ' + e.message);
      }
    }

    function getBookingActions(currentStatus, id) {
      var actions = [];
      if (currentStatus === 'new') {
        actions.push('<button onclick="updateBookingStatus(\'' + id + '\', \'confirmed\')" class="text-green-600 hover:text-green-800 mr-1">Confirm</button>');
        actions.push('<button onclick="updateBookingStatus(\'' + id + '\', \'cancelled\')" class="text-red-600 hover:text-red-800">Cancel</button>');
      } else if (currentStatus === 'confirmed') {
        actions.push('<button onclick="updateBookingStatus(\'' + id + '\', \'completed\')" class="text-purple-600 hover:text-purple-800 mr-1">Complete</button>');
        actions.push('<button onclick="updateBookingStatus(\'' + id + '\', \'cancelled\')" class="text-red-600 hover:text-red-800">Cancel</button>');
      } else if (currentStatus === 'completed' || currentStatus === 'cancelled') {
        return '<span class="text-gray-400 text-xs">No actions</span>';
      }
      return actions.join('');
    }

    async function updateBookingStatus(id, status) {
      showBookingError('');
      showBookingSuccess('');

      try {
        var token = await window.RapidFixAdmin.getAccessToken();
        if (!token) {
          showBookingError('Session expired. Please log in again.');
          return;
        }

        var response = await fetch('/api/bookings', {
          method: 'PATCH',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id: id, status: status })
        });

        if (!response.ok) {
          var err = await response.json();
          showBookingError(err.error || 'Failed to update booking.');
          return;
        }

        showBookingSuccess('Booking ' + status + ' successfully.');
        loadBookings();
      } catch (e) {
        showBookingError('Error updating booking: ' + e.message);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  </script>
