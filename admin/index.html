<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Admin — RapidFix Kenya</title>
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside id="adminSidebar" class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-sidebar-brand">
          <div class="admin-sidebar-icon">
            <i class="fas fa-cog"></i>
          </div>
          <div>
            <div class="admin-sidebar-title">Admin</div>
            <div class="admin-sidebar-subtitle">RapidFix Kenya</div>
          </div>
        </div>
        <button id="adminSidebarClose" class="admin-sidebar-close" aria-label="Close menu">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <nav class="admin-sidebar-nav">
        <a href="/admin/index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/admin/messages.html"><i class="fas fa-envelope"></i> Messages</a>
        <a href="/admin/reviews.html"><i class="fas fa-star"></i> Reviews</a>
        <a href="/admin/settings.html"><i class="fas fa-cog"></i> Site Settings</a>
        <a href="/admin/content.html"><i class="fas fa-file-alt"></i> Frontend Content</a>
        <a href="/admin/posts.html"><i class="fas fa-newspaper"></i> Posts</a>
        <a href="/admin/analytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
      </nav>
    </aside>

    <!-- Mobile overlay -->
    <div id="adminSidebarOverlay" class="admin-sidebar-overlay"></div>

    <!-- Main -->
    <div class="admin-main">
      <header class="admin-header">
        <div class="admin-header-left">
          <button id="adminMobileToggle" class="admin-mobile-toggle" aria-label="Open menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="admin-header-title">Dashboard</div>
        </div>
        <div class="admin-header-right">
          <span id="adminEmail" class="admin-header-email">Loading...</span>
          <button id="adminLogoutBtn" class="admin-logout-btn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </header>

      <main class="admin-content">
        <div class="admin-placeholder">
          <div class="admin-placeholder-icon">
            <i class="fas fa-tools"></i>
          </div>
          <h2>Admin Dashboard</h2>
          <p>The admin dashboard modules are under development. You can access the API endpoints directly while the UI is being built.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Admin Auth Utilities -->
  <script src="/js/admin-auth.js"></script>

  <!-- Admin Shell -->
  <script src="/js/admin-shell.js"></script>
</body>
</html>
