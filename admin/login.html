<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — RapidFix Kenya</title>
  <link rel="stylesheet" href="/css/tailwind.min.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-auto px-4">
    <div class="bg-white rounded-2xl border shadow-sm p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-yellow-100 text-yellow-700 mb-4">
          <i class="fas fa-lock text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Admin Login</h1>
        <p class="text-gray-500 mt-2">Sign in to access the admin dashboard</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200"
                 placeholder="admin@rapidfixkenya.site" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200"
                 placeholder="••••••••" />
        </div>
        <button type="submit" id="loginBtn"
                class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div id="loginError" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
      </div>

      <div id="loginSuccess" class="hidden mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">
      </div>
    </div>

    <p class="text-center text-gray-400 text-sm mt-6">
      <a href="/" class="hover:text-gray-600">&larr; Back to website</a>
    </p>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Admin Auth Utilities -->
  <script src="/js/admin-auth.js"></script>

  <script>
    // Configure Supabase — replace with actual values from Vercel environment or config
    window.__RAPIDFIX_SUPABASE__ = {
      url: 'https://qspxyikonaelzdvithxk.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcHh5aWtvbmFlbHpkdml0aHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwOTE1OTQsImV4cCI6MjEwMjY2NzU5NH0.dXzbBQTjRLh_bi7IHKmCnpR_Az2UdhqnQfdzRuKjV4E'
    };

    (async function () {
      var initialized = await window.RapidFixAdmin.initSupabase();
      if (!initialized) {
        showError('Admin system is not configured.');
        return;
      }

      // If already logged in as admin, redirect to dashboard
      var sessionResult = await window.RapidFixAdmin.verifySession();
      if (sessionResult.valid) {
        window.location.href = '/admin/index.html';
        return;
      }

      // Handle login form
      document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideMessages();

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        if (!email || !password) {
          showError('Please enter both email and password.');
          return;
        }

        var btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

        var result = await window.RapidFixAdmin.login(email, password);

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';

        if (result.success) {
          showSuccess('Login successful. Redirecting...');
          setTimeout(function () {
            window.location.href = '/admin/index.html';
          }, 1000);
        } else {
          showError(result.error || 'Login failed. Please try again.');
        }
      });
    })();

    function showError(message) {
      var el = document.getElementById('loginError');
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function showSuccess(message) {
      var el = document.getElementById('loginSuccess');
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function hideMessages() {
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('loginSuccess').classList.add('hidden');
    }
  </script>
</body>
</html>
